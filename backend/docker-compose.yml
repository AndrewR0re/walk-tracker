services:
  postgres:
    image: postgres:16
    container_name: walktracker-db
    environment:
      POSTGRES_DB: walktracker
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: